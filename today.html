<style>
  :root {
    --bg: #0a0a0a; --card: #141414; --border: #222;
    --text: #e0e0e0; --dim: #888; --accent: #ff6a00;
    --green: #2ecc71; --red: #e74c3c; --blue: #3498db;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    max-width: 480px; margin: 0 auto; padding: 16px 16px 40px;
    -webkit-text-size-adjust: 100%;
  }
  .header { text-align: center; padding: 20px 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .header h1 { font-size: 1.3rem; font-weight: 700; }
  .header .sub { color: var(--dim); font-size: 0.85rem; margin-top: 4px; }

  .status-bar { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
  .status-pill { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; white-space: nowrap; flex-shrink: 0; }
  .status-pill.good { border-color: var(--green); color: var(--green); }
  .status-pill.warn { border-color: var(--accent); color: var(--accent); }

  .section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .section h2 { font-size: 1rem; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

  .day-event { padding: 8px 10px; background: var(--bg); border-radius: 6px; margin-bottom: 4px; font-size: 0.85rem; }
  .day-event .time { font-weight: 600; color: var(--accent); }

  .rec-card { padding: 10px; background: var(--bg); border-radius: 8px; margin-bottom: 8px; position: relative; }
  .rec-card .name { font-weight: 600; }
  .rec-card .name a { color: var(--text); text-decoration: none; }
  .rec-card .desc { font-size: 0.78rem; color: var(--dim); margin-top: 3px; }

  .thumbs { display: flex; gap: 6px; margin-top: 6px; }
  .thumbs button { background: var(--card); border: 1px solid var(--border); border-radius: 5px; padding: 3px 10px; cursor: pointer; font-size: 0.8rem; color: var(--dim); }
  .thumbs button.voted-up { background: rgba(46,204,113,0.15); border-color: var(--green); color: var(--green); }
  .thumbs button.voted-down { background: rgba(231,76,60,0.15); border-color: var(--red); color: var(--red); }

  .tip { font-size: 0.82rem; padding: 8px 12px; background: rgba(52,152,219,0.08); border-radius: 8px; margin-bottom: 6px; }
  .tip strong { color: var(--blue); }
  .tip.warn { background: rgba(255,106,0,0.08); }
  .tip.warn strong { color: var(--accent); }
  .tip.vicky { background: rgba(255,106,0,0.06); border-left: 3px solid var(--accent); }
  .tip.vicky strong { color: var(--accent); }

  .footer { text-align: center; font-size: 0.7rem; color: var(--dim); margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .footer a { color: var(--accent); }

function getToday() {
  const now = new Date();
  const start = new Date(TRIP.start);
  const end = new Date(TRIP.end);

  if (now < start) {
    // Pre-trip — show Day 1 preview
    return { day: TRIP.days[0], index: 0, mode: 'preview' };
  }

  const dayMs = 86400000;
  const elapsedDays = Math.floor((now - start) / dayMs);
  const idx = Math.min(elapsedDays, TRIP.days.length - 1);

  return { day: TRIP.days[idx], index: idx, mode: 'active' };
}

function render() {
  const { day, mode } = getToday();

  document.getElementById('day-label').textContent = day.label;

  // Status pills
  const sb = document.getElementById('status-bar');
  sb.innerHTML = day.pills.map(p => `<span class="status-pill ${p.cls}">${p.text}</span>`).join('');

  // Weather
  document.getElementById('weather-card').innerHTML = `
    <div style="font-size:1.8rem;font-weight:800;color:var(--accent)">${day.weather.high}</div>
    <div style="font-size:0.85rem;color:var(--dim)">Low ${day.weather.low} · ${day.weather.cond}</div>
  `;

  // Timeline
  document.getElementById('timeline').innerHTML = day.timeline.map(e =>
    `<div class="day-event"><span class="time">${e.time}</span> ${e.text}</div>`
  ).join('');

  // Meals
  document.getElementById('meals').innerHTML = day.meals.map((m,i) =>
    `<div class="rec-card">
      <div class="name">${m.link ? `<a href="${m.link}">${m.name}</a>` : m.name}</div>
      <div class="desc">${m.desc}</div>
    </div>`
  ).join('');

  // Coffee
  document.getElementById('coffee').innerHTML = day.coffee.map((c,i) =>
    `<div class="rec-card" data-feedback-id="today-coffee-${i}">
      <div class="name">${c.link ? `<a href="${c.link}">${c.name}</a>` : c.name}</div>
      <div class="desc">${c.desc}</div>
      <div class="thumbs"><button onclick="vote('today-coffee-${i}','up',this)">👍</button><button onclick="vote('today-coffee-${i}','down',this)">👎</button></div>
    </div>`
  ).join('');

  // Transit
  const ts = document.getElementById('transit-section');
  const tc = document.getElementById('transit');
  if (day.transit && day.transit.length) {
    ts.style.display = '';
    tc.innerHTML = day.transit.map(t => `<div class="tip">${t}</div>`).join('');
  } else {
    ts.style.display = 'none';
  }

  // Vicky's tip
  document.getElementById('vicky-tip').innerHTML = `<strong>🧠 Vicky:</strong> ${day.tip}`;
}

// Thumbs (same as index.html — shared localStorage keys)
function vote(id, dir, btn) {
  const key = 'atlas_vote_' + id;
  let data;
  try { data = JSON.parse(localStorage.getItem(key)) || {}; } catch(e) { data = {}; }
  const prev = data.voted;
  const container = btn.parentElement;
  const upBtn = container.children[0], downBtn = container.children[1];

  if (prev === dir) {
    data.voted = null;
    upBtn.classList.remove('voted-up');
    downBtn.classList.remove('voted-down');
  } else {
    data.voted = dir;
    upBtn.classList.toggle('voted-up', dir === 'up');
    downBtn.classList.toggle('voted-down', dir === 'down');
  }
  data[dir] = (data[dir] || 0) + (prev === dir ? -1 : 1);
  if (prev && prev !== dir) data[prev] = Math.max(0, (data[prev] || 1) - 1);
  localStorage.setItem(key, JSON.stringify(data));
}

(function() {
  const els = document.querySelectorAll('.thumbs');
  els.forEach(container => {
    const id = container.parentElement.getAttribute('data-feedback-id');
    if (!id) return;
    try {
      const data = JSON.parse(localStorage.getItem('atlas_vote_' + id));
      if (data && data.voted) {
        const upBtn = container.children[0], downBtn = container.children[1];
        if (data.voted === 'up') upBtn.classList.add('voted-up');
        else downBtn.classList.add('voted-down');
      }
    } catch(e) {}
  });
})();
